name: JellyfinIOS6
options:
  bundleIdPrefix: com.jellyfin
  deploymentTarget:
    iOS: "6.0"
targets:
  JellyfinIOS6:
    type: application
    platform: iOS
    deploymentTarget: "6.0"
    sources:
      - path: .
    info:
      path: Jellyfin-Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        UIMainStoryboardFile: ""
    settings:
      base:
        PRODUCT_NAME: JellyfinIOS6
        INFOPLIST_FILE: Jellyfin-Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "6.0"
        SUPPORTED_PLATFORMS: "iphoneos"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
